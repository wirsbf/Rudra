# Cargo workspace: the root `rudra` package plus the vendored SLEIGH Rust
# compiler crates under crates/ (borrowed from kuna, Apache-2.0; see NOTICE).
# The vendored crates are standalone members -- nothing in the rudra build
# graph depends on them; they are built on demand (for example by
# tools/build_locked_x86_64_sla.sh via `cargo build -p kuna-slacomp`).
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# External (vendored SLEIGH crates' only external deps; versions unified with
# the root package so the workspace resolves a single copy of each).
thiserror = "2.0"
flate2 = "1.1"
# Intra-workspace (vendored SLEIGH crates)
kuna-base = { path = "crates/kuna-base" }
kuna-num = { path = "crates/kuna-num" }
kuna-sleigh = { path = "crates/kuna-sleigh" }
kuna-slacomp = { path = "crates/kuna-slacomp" }

# Vendored-crate clippy discipline (kuna ADR 0002: deterministic iteration
# order -- BTreeMap/BTreeSet only). Only crates that opt in via
# `[lints] workspace = true` are affected; the root rudra package does not
# opt in. The disallow list lives in ./clippy.toml.
[workspace.lints.clippy]
disallowed_types = "deny"

[package]
name = "rudra"
version = "0.1.0"
edition = "2021"
authors = ["Rudra Contributors"]
description = "A Rust-based decompiler inspired by Ghidra for C/C++ binaries"
license = "Apache-2.0"
repository = "https://github.com/wirsbf/Rudra"
readme = "README.md"
keywords = ["decompiler", "reverse-engineering", "binary-analysis", "disassembler"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
once_cell = "1.19"
# Binary parsing
goblin = "0.8"
object = "0.36"
gimli = { version = "0.28.1", default-features = false, features = ["read", "std", "endian-reader"] }
# C++ name demangling (Itanium ABI) on the ELF symbol import path
cpp_demangle = "0.5"

# SLEIGH decode runtime (Phase2 dual chain, SLEIGH-RUSTIFY-PHASE2-0001):
# kuna-sleigh is the Rust engine behind src/sleigh_ffi.rs; kuna-base/kuna-num
# are named directly because the engine's public API exposes their types.
kuna-base = { workspace = true }
kuna-num = { workspace = true }
kuna-sleigh = { workspace = true }

# Data structures
petgraph = "0.6"
rustc-hash = "2.0"
indexmap = "2.0"

# Error handling
# thiserror 2.x unifies with the vendored SLEIGH crates (workspace dep).
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Compression
flate2 = "1.0"
libz-sys = "=1.1.29"

# Logging
log = "0.4"
env_logger = "0.11"

# CLI (optional)
clap = { version = "4.5", features = ["derive"], optional = true }

# Utilities
lazy_static = "1.4"
bitvec = "1.0"
num-traits = "0.2"
num-derive = "0.4"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
pretty_assertions = "1.4"

[features]
default = ["cli"]
cli = ["dep:clap"]
ffi-test = []

[lib]
crate-type = ["rlib"]

[[bin]]
name = "rudra"
required-features = ["cli"]

[[example]]
name = "decompress_1204_oracle"
path = "tests/oracle/decompress_1204.rs"

[[example]]
name = "constseq_stringcopy_1204_oracle"
path = "tests/oracle/constseq_stringcopy_1204.rs"
[[example]]
name = "funcproto_lock_1204_oracle"
path = "tests/oracle/funcproto_lock_1204.rs"

[[example]]
name = "infertypes_settle_1204_oracle"
path = "tests/oracle/infertypes_settle_1204.rs"

[[example]]
name = "varmap_dupdecl_1204_oracle"
path = "tests/oracle/varmap_dupdecl_1204.rs"

[[example]]
name = "funcdata_nodesplit_space_1204_oracle"
path = "tests/oracle/funcdata_nodesplit_space_1204.rs"

[[example]]
name = "subflow_transform_subfloat_1204_oracle"
path = "tests/oracle/subflow_transform_subfloat_1204.rs"

[[example]]
name = "debugproto_unknown_model_1204_oracle"
path = "tests/oracle/debugproto_unknown_model_1204.rs"

[[example]]
name = "callspec_copy_1204_oracle"
path = "tests/oracle/callspec_copy_1204.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Fast feedback for semantic work.  The canonical release profile above stays
# unchanged for final artifacts; this profile trades final link optimization
# for parallel code generation, thin LTO, and incremental reuse.
[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
incremental = true

[profile.dev]
opt-level = 1

[profile.bench]
inherits = "release"

[[bench]]
name = "decompile_bench"
harness = false
